<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>AJ | Luxury Store</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #e8e2d9; font-family: 'Lato', sans-serif; padding-bottom: 20px; color: #333; }
  
  header { background: #111; padding: 16px 20px; position: sticky; top: 0; z-index: 10; display: flex; justify-content: space-between; align-items: center; }
  .logo { font-family: 'Playfair Display', serif; color: #d4af37; font-size: 24px; font-weight: 600; letter-spacing: 2px; text-decoration: none; }
  .nav-icons { display: flex; align-items: center; gap: 16px; color: #fff; font-size: 20px; cursor: pointer; text-decoration: none; }
  #headerCartCount { font-size: 14px; font-weight: bold; color: #d4af37; margin-left: 4px; background: rgba(212, 175, 55, 0.2); padding: 2px 8px; border-radius: 12px; }
  
  .hero { background: #e8e2d9; padding: 60px 20px; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 320px; }
  .hero h1 { font-family: 'Playfair Display', serif; font-size: 34px; color: #111; margin-bottom: 12px; letter-spacing: 1px; }
  .hero p { font-size: 14px; color: #555; margin-bottom: 24px; max-width: 300px; line-height: 1.5; }
  .hero-btn { background: #111; color: #d4af37; padding: 14px 36px; text-decoration: none; font-size: 13px; font-weight: bold; letter-spacing: 2px; text-transform: uppercase; border: 1px solid #111; transition: 0.3s; }
  .hero-btn:hover { background: #d4af37; color: #111; }

  .search-wrap { padding: 20px; }
  .search-bar { background: #fff; padding: 14px; display: flex; align-items: center; gap: 10px; border: 1px solid #ddd; }
  .search-bar input { border: none; background: transparent; width: 100%; outline: none; font-size: 14px; color: #333; }

  .categories-wrap { padding: 30px 20px; }
  .section-title { font-family: 'Playfair Display', serif; font-size: 24px; color: #111; margin-bottom: 20px; text-align: center; text-transform: uppercase; letter-spacing: 2px; }
  .cat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
  .cat-card { position: relative; height: 200px; border-radius: 8px; overflow: hidden; text-decoration: none; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
  .cat-card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }
  .cat-card:hover img { transform: scale(1.05); }
  .cat-card .overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.8), transparent); }
  .cat-card h3 { position: relative; z-index: 2; font-family: 'Playfair Display', serif; color: #d4af37; font-size: 22px; letter-spacing: 2px; text-transform: uppercase; }

  .products-wrap { padding: 0 20px 30px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; }
  .card { background: #fff; padding: 12px; text-decoration: none; color: inherit; display: flex; flex-direction: column; transition: 0.3s; border: 1px solid #eee; border-radius: 8px; }
  .card:hover { box-shadow: 0 10px 20px rgba(0,0,0,0.08); transform: translateY(-2px); }
  .card-img { width: 100%; height: 180px; object-fit: cover; margin-bottom: 12px; background: #f9f9f9; border-radius: 4px; }
  .card-emoji { font-size: 50px; text-align: center; margin-bottom: 10px; height: 180px; display: flex; align-items: center; justify-content: center; background: #f9f9f9; border-radius: 4px; }
  .card h3 { font-family: 'Playfair Display', serif; font-size: 16px; margin-bottom: 4px; color: #111; }
  .card .brand { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
  .priceRow { display: flex; justify-content: space-between; align-items: center; margin-top: auto; }
  .price { font-size: 16px; font-weight: bold; color: #111; }
  .addBtn { background: #111; color: #d4af37; border: none; padding: 6px 14px; font-size: 11px; font-weight: bold; text-transform: uppercase; cursor: pointer; border-radius: 4px; }
  
  /* Side Menu */
  #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 99; display: none; }
  #sideMenu { position: fixed; top: 0; left: -300px; width: 300px; height: 100vh; background: #111; z-index: 100; transition: 0.3s ease-in-out; display: flex; flex-direction: column; }
  #sideMenu.open { left: 0; }
  .side-header { padding: 40px 20px 20px; border-bottom: 1px solid #333; }
  .side-header h2 { font-family: 'Playfair Display', serif; color: #d4af37; font-size: 22px; margin-bottom: 4px; }
  .side-header p { color: #888; font-size: 13px; }
  .side-links { flex: 1; padding: 20px 0; }
  .side-links a { display: flex; align-items: center; gap: 12px; padding: 16px 20px; text-decoration: none; color: #ddd; font-size: 14px; letter-spacing: 1px; text-transform: uppercase; border-bottom: 1px solid #222; }
  .side-links a:hover { background: #222; color: #d4af37; }
</style>
</head>
<body>

<div id="overlay" onclick="toggleMenu()"></div>
<div id="sideMenu">
  <div class="side-header">
    <h2 id="menuName">Welcome</h2>
    <p id="menuPhone">Guest User</p>
  </div>
  <div class="side-links">
    <a href="/orders.html"><span>📦</span> My Orders</a>
    <a href="/profile.html"><span>👤</span> My Profile</a>
    <a href="/help.html"><span>🎧</span> Concierge</a>
    <a href="/"><span>🏠</span> Home</a>
  </div>
</div>

<header>
  <div class="nav-icons" onclick="toggleMenu()">☰</div>
  <a href="/" class="logo">AJ</a>
  <a href="/cart.html" class="nav-icons">🛒 <span id="headerCartCount"></span></a>
</header>

<div class="hero">
  <h1>Premium Collections</h1>
  <p>Discover our exclusive range of fashion, beauty, and gourmet essentials.</p>
  <a href="#shop" class="hero-btn">Shop Now</a>
</div>

<div class="search-wrap">
  <div class="search-bar">
    🔍 <input type="text" id="searchInput" placeholder="Search for dresses, skincare, groceries...">
  </div>
</div>

<div class="categories-wrap" id="categoriesWrap">
  <div class="section-title">Shop by Department</div>
  <div class="cat-grid" id="categoryList"></div>
</div>

<div class="products-wrap" id="shop">
  <div class="section-title" id="mainSectionTitle">Featured Products</div>
  <div class="grid" id="productGrid"><p>Loading collections...</p></div>
</div>

<script>
  const API = '/api';
  
  const mainCategories = [
    { name: 'Clothes', image: 'https://images.unsplash.com/photo-1445205170230-053b83016050?q=80&w=600&auto=format&fit=crop' },
    { name: 'Cosmetics', image: 'https://images.unsplash.com/photo-1596462502278-27bfdc403348?q=80&w=600&auto=format&fit=crop' },
    { name: 'Groceries', image: 'https://images.unsplash.com/photo-1542838132-92c53300491e?q=80&w=600&auto=format&fit=crop' }
  ];

  function getCart() { return JSON.parse(localStorage.getItem('cart') || '{}'); }
  function saveCart(cart) { localStorage.setItem('cart', JSON.stringify(cart)); }

  function toggleMenu() {
    const menu = document.getElementById('sideMenu');
    const overlay = document.getElementById('overlay');
    if (menu.classList.contains('open')) { menu.classList.remove('open'); overlay.style.display = 'none'; }
    else { menu.classList.add('open'); overlay.style.display = 'block'; }
  }

  const savedDetails = JSON.parse(localStorage.getItem('customerDetails') || 'null');
  if (savedDetails && savedDetails.name) {
    document.getElementById('menuName').textContent = `Hello, ${savedDetails.name}`;
    document.getElementById('menuPhone').textContent = savedDetails.phone;
  }

  function loadCategories() {
    const list = document.getElementById('categoryList');
    list.innerHTML = mainCategories.map(c => `
      <a href="/category.html?cat=${encodeURIComponent(c.name)}" class="cat-card">
        <img src="${c.image}" alt="${c.name}">
        <div class="overlay"></div>
        <h3>${c.name}</h3>
      </a>
    `).join('');
  }

  async function loadProducts(searchTerm = '') {
    try {
      const url = searchTerm ? `${API}/products?search=${encodeURIComponent(searchTerm)}` : `${API}/products`;
      const res = await fetch(url);
      const data = await res.json();
      let allProducts = data.products || [];
      
      allProducts.sort((a, b) => (b.orderCount || 0) - (a.orderCount || 0));
      
      if (searchTerm) {
        document.getElementById('categoriesWrap').style.display = 'none';
        document.getElementById('mainSectionTitle').textContent = `Search Results`;
      } else {
        document.getElementById('categoriesWrap').style.display = 'block';
        document.getElementById('mainSectionTitle').textContent = 'Featured Products';
      }

      const grid = document.getElementById('productGrid');
      if (allProducts.length === 0) { grid.innerHTML = '<p>No products found.</p>'; return; }
      
      grid.innerHTML = allProducts.map(p => {
        return `
        <a href="/product.html?id=${p._id}" class="card">
          ${p.imageUrl ? `<img src="${p.imageUrl}" class="card-img" alt="${p.name}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">` : ''}
          <div class="card-emoji" style="${p.imageUrl ? 'display:none;' : ''}">✨</div>
          <h3>${p.name}</h3>
          <div class="brand">${p.category}</div>
          <div class="priceRow">
            <span class="price">₹${p.price}</span>
            <button class="addBtn" onclick="event.preventDefault(); addToCart('${p._id}', '${p.name}', ${p.price}, ${p.stock})" ${p.stock === 0 ? 'disabled' : ''}>${p.stock === 0 ? 'Sold Out' : 'Add'}</button>
          </div>
        </a>
      `}).join('');
    } catch (err) { console.error(err); }
  }

  function addToCart(id, name, price, stock) {
    const cart = getCart();
    if (!cart[id]) cart[id] = { name, price, quantity: 0 };
    if (cart[id].quantity >= stock) return alert(`Only ${stock} remaining`);
    cart[id].quantity += 1;
    saveCart(cart);
    updateCartBadge();
  }

  function updateCartBadge() {
    const cart = getCart();
    const count = Object.values(cart).reduce((s, i) => s + i.quantity, 0);
    document.getElementById('headerCartCount').textContent = count > 0 ? count : '';
  }

  let searchTimeout;
  document.getElementById('searchInput').addEventListener('input', (e) => {
    const searchTerm = e.target.value.trim();
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(() => { loadProducts(searchTerm); }, 300);
  });

  updateCartBadge(); loadCategories(); loadProducts();
</script>
</body>
</html>
