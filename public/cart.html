<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Bag</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Lato', sans-serif; background: #e8e2d9; padding: 20px; color: #333; }
  
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
  h2 { font-family: 'Playfair Display', serif; font-size: 24px; color: #111; }
  .back-link { text-decoration: none; color: #111; font-weight: bold; font-size: 14px; }
  
  .item { background: #fff; padding: 16px; margin-bottom: 12px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #ddd; }
  .item-info h4 { font-family: 'Playfair Display', serif; font-size: 16px; margin-bottom: 4px; color: #111; }
  .item-info p { font-size: 13px; color: #666; }
  
  .controls { display: flex; align-items: center; gap: 12px; }
  .controls button { background: #111; color: #d4af37; border: none; width: 28px; height: 28px; border-radius: 50%; font-size: 16px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .controls .remove { background: transparent; color: #c62828; width: auto; border-radius: 0; font-size: 12px; text-transform: uppercase; }
  
  .summary { background: #fff; padding: 20px; border-radius: 8px; margin-top: 24px; border: 1px solid #ddd; }
  .summary h3 { display: flex; justify-content: space-between; font-size: 18px; margin-bottom: 16px; }
  
  .checkout-btn { display: block; width: 100%; padding: 16px; background: #111; color: #d4af37; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; margin-top: 16px; cursor: pointer; text-align: center; text-decoration: none; }
</style>
</head>
<body>

<div class="header">
  <h2>Your Bag</h2>
  <a href="/" class="back-link">← Continue Shopping</a>
</div>

<div id="cartList"></div>

<div class="summary" id="summaryBox" style="display: none;">
  <h3><span>Total:</span> <span id="cartTotal">₹0</span></h3>
  <a href="/checkout.html" class="checkout-btn">Proceed to Checkout</a>
</div>

<script>
  function getCart() { return JSON.parse(localStorage.getItem('cart') || '{}'); }
  function saveCart(c) { localStorage.setItem('cart', JSON.stringify(c)); }

  function render() {
    const cart = getCart();
    const list = document.getElementById('cartList');
    const summary = document.getElementById('summaryBox');
    const entries = Object.entries(cart).filter(([_, v]) => v.quantity > 0);
    
    if (entries.length === 0) {
      list.innerHTML = '<p style="text-align:center; margin-top:40px; color:#666;">Your bag is currently empty.</p>';
      summary.style.display = 'none';
      return;
    }
    
    let total = 0;
    list.innerHTML = entries.map(([id, item]) => {
      total += item.price * item.quantity;
      return `<div class="item">
        <div class="item-info">
          <h4>${item.name}</h4>
          <p>₹${item.price}</p>
        </div>
        <div class="controls">
          <button onclick="change('${id}', -1)">−</button>
          <span style="font-weight:bold;">${item.quantity}</span>
          <button onclick="change('${id}', 1)">+</button>
          <button class="remove" onclick="removeItem('${id}')">Remove</button>
        </div>
      </div>`;
    }).join('');

    document.getElementById('cartTotal').textContent = '₹' + total;
    summary.style.display = 'block';
  }

  function change(id, delta) {
    const cart = getCart();
    cart[id].quantity += delta;
    if (cart[id].quantity <= 0) delete cart[id];
    saveCart(cart);
    render();
  }
  function removeItem(id) {
    const cart = getCart();
    delete cart[id];
    saveCart(cart);
    render();
  }
  render();
</script>
</body>
</html>
