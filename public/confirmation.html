<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Confirmed</title>
<style>
  body { font-family: sans-serif; background: #f5f5f5; padding: 24px; text-align: center; }
  .box { background: white; border-radius: 16px; padding: 32px 20px; max-width: 420px; margin: 0 auto; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
  .check { font-size: 56px; }
  h1 { font-size: 22px; margin: 12px 0; color: #2e7d32; }
  .id { background: #e8f5e9; color: #2e7d32; padding: 6px 14px; border-radius: 20px; font-size: 13px; display: inline-block; margin: 10px 0; }
  .total { font-size: 20px; font-weight: bold; margin: 16px 0; }
  .note { color: #666; font-size: 13px; margin: 12px 0; }
  a { display: inline-block; margin-top: 16px; padding: 12px 28px; background: #2e7d32; color: white; border-radius: 10px; text-decoration: none; font-weight: bold; }
</style>
</head>
<body>
<div class="box">
  <div class="check">✅</div>
  <h1>Order Placed!</h1>
  <div class="id" id="orderId">Loading...</div>
  <div class="total" id="total"></div>
  <p class="note">We'll call you shortly to confirm. Cash on Delivery.</p>
  <a href="/">← Back to Shop</a>
</div>
<script>
  const order = JSON.parse(localStorage.getItem('lastOrder') || 'null');
  if (order) {
    document.getElementById('orderId').textContent = 'Order #' + order._id.slice(-6).toUpperCase();
    document.getElementById('total').textContent = 'Total: ₹' + order.totalAmount;
  }
</script>
</body>
</html>
