<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout</title>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
  body { background: #f8f9fa; padding: 16px; color: #333; }
  
  .top-nav { margin-bottom: 16px; display: flex; align-items: center; gap: 16px; }
  .back-btn { font-size: 20px; text-decoration: none; color: #333; font-weight: bold; }
  h2 { font-size: 20px; }
  
  .section-title { font-size: 16px; font-weight: bold; margin-bottom: 12px; color: #111; }
  
  .address-card { background: white; border: 1px solid #ddd; border-radius: 12px; padding: 16px; margin-bottom: 12px; cursor: pointer; transition: 0.2s; }
  .address-card.selected { border: 2px solid #1ABC9C; background: #f0fdfa; }
  .address-card h4 { font-size: 15px; margin-bottom: 4px; }
  .address-card p { font-size: 13px; color: #666; line-height: 1.4; }
  
  .new-address-form { background: white; border-radius: 12px; padding: 16px; display: none; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
  .input-group { margin-bottom: 12px; }
  .input-group label { display: block; font-size: 12px; font-weight: bold; color: #555; margin-bottom: 6px; }
  .input-group input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; outline: none; }
  .input-group input:focus { border-color: #1ABC9C; }
  
  .payment-section { background: white; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; outline: none; }
  
  .submit-btn { width: 100%; padding: 16px; background: #1ABC9C; color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 12px rgba(26, 188, 156, 0.3); }
  .submit-btn:disabled { background: #ccc; box-shadow: none; }
</style>
</head>
<body>

<div class="top-nav">
  <a href="/cart.html" class="back-btn">←</a>
  <h2>Checkout</h2>
</div>

<div class="section-title">1. Delivery Address</div>
<div id="savedAddresses"></div>

<div class="address-card" id="addNewBtn" onclick="showNewAddressForm()" style="border-style: dashed; text-align: center; color: #1ABC9C; font-weight: bold;">
  + Add New Address
</div>

<div class="new-address-form" id="newAddressForm">
  <div class="input-group"><label>Full Name</label><input id="name" placeholder="e.g. Amrutha" required></div>
  <div class="input-group"><label>Phone Number</label><input id="phone" type="tel" placeholder="10-digit mobile number" required></div>
  <div class="input-group"><label>House / Flat / Building No.</label><input id="house" placeholder="e.g. Flat 204, Skyview Apartments" required></div>
  <div class="input-group"><label>Street / Area</label><input id="street" placeholder="e.g. Byagadadenahalli" required></div>
  <div class="input-group"><label>Landmark (Optional)</label><input id="landmark" placeholder="e.g. Near Anekal Bus Stand"></div>
  <div class="input-group"><label>City / Pincode</label><input id="city" placeholder="e.g. Anekal, 562106" required></div>
  <button class="submit-btn" style="padding: 10px; font-size: 14px;" onclick="saveNewAddress()">Save Address</button>
</div>

<div class="section-title">2. Payment Method</div>
<div class="payment-section">
  <select id="payment">
    <option value="COD">Cash on Delivery</option>
    <option value="UPI">UPI (Razorpay)</option>
  </select>
</div>

<button class="submit-btn" id="submitBtn" onclick="placeOrder()">Place Order</button>
<a href="/" style="display:block; text-align:center; margin-top:16px; color:#666; text-decoration:none;">← Back to Home</a>

<script>
  let addresses = JSON.parse(localStorage.getItem('customerAddresses') || '[]');
  let selectedAddressIndex = -1;

  function renderAddresses() {
    const container = document.getElementById('savedAddresses');
    if (addresses.length === 0) {
      container.innerHTML = '';
      showNewAddressForm(); // Automatically show form if no addresses
      return;
    }

    container.innerHTML = addresses.map((addr, index) => `
      <div class="address-card ${index === selectedAddressIndex ? 'selected' : ''}" onclick="selectAddress(${index})">
        <h4>${addr.name} • ${addr.phone}</h4>
        <p>${addr.house}, ${addr.street}, ${addr.city}</p>
        ${addr.landmark ? `<p><small>Landmark: ${addr.landmark}</small></p>` : ''}
      </div>
    `).join('');
  }

  function selectAddress(index) {
    selectedAddressIndex = index;
    renderAddresses();
    document.getElementById('newAddressForm').style.display = 'none';
  }

  function showNewAddressForm() {
    document.getElementById('newAddressForm').style.display = 'block';
    selectedAddressIndex = -1;
    renderAddresses();
  }

  function saveNewAddress() {
    const name = document.getElementById('name').value;
    const phone = document.getElementById('phone').value;
    const house = document.getElementById('house').value;
    const street = document.getElementById('street').value;
    const landmark = document.getElementById('landmark').value;
    const city = document.getElementById('city').value;

    if (!name || !phone || !house || !street || !city) {
      return alert("Please fill all required fields.");
    }

    const newAddr = { name, phone, house, street, landmark, city };
    addresses.push(newAddr);
    localStorage.setItem('customerAddresses', JSON.stringify(addresses));
    
    selectedAddressIndex = addresses.length - 1;
    renderAddresses();
    document.getElementById('newAddressForm').style.display = 'none';
  }

  async function placeOrder() {
    if (selectedAddressIndex === -1) {
      return alert("Please select or add a delivery address.");
    }

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'Processing...';

    const addr = addresses[selectedAddressIndex];
    const fullAddress = `${addr.house}, ${addr.street}, ${addr.landmark ? addr.landmark + ', ' : ''}${addr.city}`;
    
    const cart = JSON.parse(localStorage.getItem('cart') || '{}');
    const items = Object.entries(cart).filter(([_, v]) => v.quantity > 0).map(([id, v]) => ({ product: id, quantity: v.quantity }));
    const paymentMethod = document.getElementById('payment').value;
    let totalAmount = Object.values(cart).reduce((s, i) => s + i.price * i.quantity, 0);

    if (items.length === 0) {
      alert('Cart is empty'); btn.disabled = false; btn.textContent = 'Place Order'; return;
    }

    if (paymentMethod === 'COD') {
      await submitOrderToDB(addr.name, addr.phone, fullAddress, items, 'COD');
    } else {
      // Razorpay Logic (Same as before)
      alert('Razorpay is in test mode. Please select Cash on Delivery.');
      btn.disabled = false; btn.textContent = 'Place Order';
    }
  }

  async function submitOrderToDB(name, phone, address, items, paymentType) {
    const body = {
      customer: { name, phone, address },
      items, paymentMethod: paymentType
    };

    try {
      const res = await fetch('/api/orders', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
      });
      const data = await res.json();
      
      if (data.success) {
        localStorage.setItem('lastOrder', JSON.stringify(data.order));
        localStorage.removeItem('cart');
        window.location.href = '/confirmation.html';
      } else {
        alert('Error: ' + data.error);
        document.getElementById('submitBtn').disabled = false;
        document.getElementById('submitBtn').textContent = 'Place Order';
      }
    } catch (err) {
      alert('Failed to connect to server.');
      document.getElementById('submitBtn').disabled = false;
      document.getElementById('submitBtn').textContent = 'Place Order';
    }
  }

  renderAddresses();
</script>
</body>
</html>
