<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout</title>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
  body { background: #f0f4f8; padding: 16px; color: #333; }
  
  .top-nav { margin-bottom: 16px; display: flex; align-items: center; gap: 16px; }
  .back-btn { font-size: 20px; text-decoration: none; color: #333; font-weight: bold; }
  h2 { font-size: 20px; }
  
  .section-title { font-size: 16px; font-weight: bold; margin-bottom: 12px; color: #111; margin-top: 24px; }
  
  /* Address Cards */
  .address-card { background: white; border: 1px solid #ddd; border-radius: 12px; padding: 16px; margin-bottom: 12px; cursor: pointer; }
  .address-card.selected { border: 2px solid #1ABC9C; background: #f0fdfa; }
  .address-card h4 { font-size: 15px; margin-bottom: 4px; }
  .address-card p { font-size: 13px; color: #666; line-height: 1.4; }
  
  .new-address-form { background: white; border-radius: 12px; padding: 16px; display: none; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
  .input-group { margin-bottom: 12px; }
  .input-group label { display: block; font-size: 12px; font-weight: bold; color: #555; margin-bottom: 6px; }
  .input-group input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; outline: none; }
  .input-group input:focus { border-color: #1ABC9C; }
  
  /* Payment Options */
  .payment-options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px; }
  .pay-card { background: white; border: 1px solid #ddd; border-radius: 12px; padding: 16px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 15px; font-weight: 500; }
  .pay-card.selected { border: 2px solid #1ABC9C; background: #f0fdfa; }
  .pay-icon { font-size: 20px; margin-right: 10px; }
  
  /* Buttons */
  .btn-main { width: 100%; padding: 16px; background: #1ABC9C; color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 12px rgba(26, 188, 156, 0.3); margin-bottom: 12px; }
  .btn-main:disabled { background: #ccc; box-shadow: none; }
  .btn-outline { width: 100%; padding: 14px; background: transparent; color: #436ca4; border: 2px solid #436ca4; border-radius: 12px; font-size: 15px; font-weight: bold; cursor: pointer; }
</style>
</head>
<body>

<div class="top-nav">
  <a href="/cart.html" class="back-btn">←</a>
  <h2>Checkout</h2>
</div>

<!-- STEP 1: ADDRESS -->
<div id="step-address">
  <div class="section-title">Delivery Address</div>
  <div id="savedAddresses"></div>

  <div class="address-card" id="addNewBtn" onclick="showNewAddressForm()" style="border-style: dashed; text-align: center; color: #1ABC9C; font-weight: bold;">
    + Add New Address
  </div>

  <div class="new-address-form" id="newAddressForm">
    <div class="input-group"><label>Full Name</label><input id="name" required></div>
    <div class="input-group"><label>Phone Number</label><input id="phone" type="tel" required></div>
    <div class="input-group"><label>House / Flat / Building No.</label><input id="house" required></div>
    <div class="input-group"><label>Street / Area</label><input id="street" required></div>
    <div class="input-group"><label>Landmark (Optional)</label><input id="landmark"></div>
    <div class="input-group"><label>City / Pincode</label><input id="city" required></div>
    <button class="btn-main" onclick="saveNewAddress()">Save Address</button>
  </div>

  <button class="btn-main" id="continueBtn" onclick="goToPayment()" disabled style="margin-top: 24px;">Continue to Payment</button>
</div>

<!-- STEP 2: PAYMENT -->
<div id="step-payment" style="display: none;">
  <div class="section-title">Select Payment Method</div>
  
  <div class="payment-options">
    <div class="pay-card selected" id="pay-COD" onclick="selectPayment('COD')">
      <div><span class="pay-icon">💵</span> Cash on Delivery</div>
      <div id="check-COD">✅</div>
    </div>
    <div class="pay-card" id="pay-UPI" onclick="selectPayment('UPI')">
      <div><span class="pay-icon">📱</span> UPI (GPay, PhonePe)</div>
      <div id="check-UPI"></div>
    </div>
    <div class="pay-card" id="pay-CARD" onclick="selectPayment('CARD')">
      <div><span class="pay-icon">💳</span> Credit / Debit Card</div>
      <div id="check-CARD"></div>
    </div>
  </div>

  <button class="btn-main" id="submitBtn" onclick="placeOrder()">Place Order</button>
  <button class="btn-outline" onclick="goToAddress()">← Change Address</button>
</div>

<a href="/" style="display:block; text-align: center; margin-top: 24px; color: #666; text-decoration: none;">← Back to Home</a>

<script>
  let addresses = JSON.parse(localStorage.getItem('customerAddresses') || '[]');
  let selectedAddressIndex = -1;
  let selectedPaymentMethod = 'COD';

  // --- STEP 1 LOGIC ---
  function renderAddresses() {
    const container = document.getElementById('savedAddresses');
    if (addresses.length === 0) {
      container.innerHTML = '';
      showNewAddressForm();
      return;
    }
    container.innerHTML = addresses.map((addr, index) => `
      <div class="address-card ${index === selectedAddressIndex ? 'selected' : ''}" onclick="selectAddress(${index})">
        <h4>${addr.name} • ${addr.phone}</h4>
        <p>${addr.house}, ${addr.street}, ${addr.city}</p>
        ${addr.landmark ? `<p><small>Landmark: ${addr.landmark}</small></p>` : ''}
      </div>
    `).join('');
  }

  function selectAddress(index) {
    selectedAddressIndex = index;
    renderAddresses();
    document.getElementById('newAddressForm').style.display = 'none';
    document.getElementById('continueBtn').disabled = false; // Enable continue button
  }

  function showNewAddressForm() {
    document.getElementById('newAddressForm').style.display = 'block';
    selectedAddressIndex = -1;
    document.getElementById('continueBtn').disabled = true;
    renderAddresses();
  }

  function saveNewAddress() {
    const name = document.getElementById('name').value;
    const phone = document.getElementById('phone').value;
    const house = document.getElementById('house').value;
    const street = document.getElementById('street').value;
    const landmark = document.getElementById('landmark').value;
    const city = document.getElementById('city').value;

    if (!name || !phone || !house || !street || !city) return alert("Please fill all required fields.");

    const newAddr = { name, phone, house, street, landmark, city };
    addresses.push(newAddr);
    localStorage.setItem('customerAddresses', JSON.stringify(addresses));
    selectedAddressIndex = addresses.length - 1;
    
    renderAddresses();
    document.getElementById('newAddressForm').style.display = 'none';
    document.getElementById('continueBtn').disabled = false;
  }

  // --- PAGE TRANSITIONS ---
  function goToPayment() {
    if (selectedAddressIndex === -1) return alert("Please select an address.");
    document.getElementById('step-address').style.display = 'none';
    document.getElementById('step-payment').style.display = 'block';
  }

  function goToAddress() {
    document.getElementById('step-payment').style.display = 'none';
    document.getElementById('step-address').style.display = 'block';
  }

  // --- STEP 2 LOGIC ---
  function selectPayment(method) {
    selectedPaymentMethod = method;
    ['COD', 'UPI', 'CARD'].forEach(m => {
      document.getElementById('pay-' + m).classList.remove('selected');
      document.getElementById('check-' + m).textContent = '';
    });
    document.getElementById('pay-' + method).classList.add('selected');
    document.getElementById('check-' + method).textContent = '✅';
  }

  // --- PLACE ORDER ---
  async function placeOrder() {
    if (selectedAddressIndex === -1) return alert("Please select an address.");

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'Processing...';

    const addr = addresses[selectedAddressIndex];
    const fullAddress = `${addr.house}, ${addr.street}, ${addr.landmark ? addr.landmark + ', ' : ''}${addr.city}`;
    
    const cart = JSON.parse(localStorage.getItem('cart') || '{}');
    const items = Object.entries(cart).filter(([_, v]) => v.quantity > 0).map(([id, v]) => ({ product: id, quantity: v.quantity }));
    let totalAmount = Object.values(cart).reduce((s, i) => s + i.price * i.quantity, 0);

    if (items.length === 0) {
      alert('Cart is empty'); btn.disabled = false; btn.textContent = 'Place Order'; return;
    }

    if (selectedPaymentMethod === 'COD') {
      await submitOrderToDB(addr.name, addr.phone, fullAddress, items, 'COD');
    } else {
      // For UPI or Card, we use Razorpay
      try {
        const res = await fetch('/api/payment/create-order', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ amount: totalAmount * 100 }) 
        });
        const data = await res.json();
        
        if (!data.success) throw new Error(data.error);

        const options = {
          key: "YOUR_RAZORPAY_KEY_ID", // Put your Razorpay Key here later
          amount: data.order.amount,
          currency: "INR",
          name: "Fresh Groceries",
          order_id: data.order.id,
          handler: async function (response) {
            alert("Payment Successful!");
            await submitOrderToDB(addr.name, addr.phone, fullAddress, items, selectedPaymentMethod); 
          },
          theme: { color: "#1ABC9C" }
        };
        
        const rzp = new window.Razorpay(options);
        rzp.on('payment.failed', function (response){
          alert("Payment Failed: " + response.error.description);
          btn.disabled = false; btn.textContent = 'Place Order';
        });
        rzp.open();

      } catch (err) {
        alert('❌ ' + err.message + '\nPlease select Cash on Delivery to test.');
        btn.disabled = false; btn.textContent = 'Place Order';
      }
    }
  }

  async function submitOrderToDB(name, phone, address, items, paymentType) {
    const body = { customer: { name, phone, address }, items, paymentMethod: paymentType };

    try {
      const res = await fetch('/api/orders', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
      });
      const data = await res.json();
      
      if (data.success) {
        localStorage.setItem('lastOrder', JSON.stringify(data.order));
        localStorage.removeItem('cart');
        window.location.href = '/confirmation.html';
      } else {
        alert('Error: ' + data.error);
        document.getElementById('submitBtn').disabled = false;
        document.getElementById('submitBtn').textContent = 'Place Order';
      }
    } catch (err) {
      alert('Failed to connect to server.');
      document.getElementById('submitBtn').disabled = false;
      document.getElementById('submitBtn').textContent = 'Place Order';
    }
  }

  // Initialize
  renderAddresses();
  if (addresses.length > 0) {
    selectAddress(0); 
  }
</script>
</body>
</html>
